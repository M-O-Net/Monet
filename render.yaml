# Render Blueprint — the API, the static frontend and Postgres, deployed together from one
# workspace. See root AGENTS.md > Deployment.
#
# One thing to confirm on a first deploy: that the static host serves .mjs as JavaScript — if it
# doesn't, the sandbox alone fails.

databases:
  - name: monet-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"

services:
  - type: web
    name: monet-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    domains:
      - api.monet.wiki
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monet-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://monet.wiki", "https://www.monet.wiki"]'
    # Render execs dockerCommand directly rather than through a shell, so this has to be one
    # script, not a `&&` chain. Both steps in it are idempotent.
    dockerCommand: ./scripts/start.sh

  - type: web
    name: monet-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @monet/web build
    staticPublishPath: apps/web/dist
    domains:
      - monet.wiki
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    envVars:
      - key: VITE_API_URL
        value: https://api.monet.wiki
