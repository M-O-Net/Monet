# Render Blueprint — defines all three v0 deployables (API, static frontend, Postgres) together
# for a one-step deploy from a single account/dashboard. See root AGENTS.md > Deployment.
#
# Field names check out against https://render.com/docs/blueprint-spec, but this has never run
# against a real account. Two things to confirm on the first deploy: that the service names below
# were still free (Render appends a suffix if not, which would make the two URLs here wrong), and
# that the static host serves .mjs as JavaScript — if it doesn't, the sandbox alone fails.
#
# Everything here is on a free plan. Render's free Postgres auto-deletes after ~30 days: the
# dataset is `apps/api/scripts/seed.py`, so losing it costs nothing until there is real data —
# at which point move the database to `plan: basic-256mb` (see AGENTS.md > Deployment).

databases:
  - name: monet-db
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: monet-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monet-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://monet-web.onrender.com"]' # adjust to the actual static site URL
    preDeployCommand: uv run alembic upgrade head && uv run python scripts/seed.py --if-empty

  - type: web
    name: monet-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @monet/web build
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    envVars:
      - key: VITE_API_URL
        value: https://monet-api.onrender.com # adjust to the actual API URL
