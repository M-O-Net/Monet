# Serves the built Vite site. The one non-default piece is the CORS header: the implementation
# sandbox runs on an opaque origin (see src/sandbox/frame.ts), so its own module bundle and every
# Pyodide asset it loads are cross-origin requests that a bare nginx would serve without
# Access-Control-Allow-Origin — and the sandbox would fail to boot with no obvious cause. These
# are public static files with no credentials, so a blanket allow is safe. Mirrored in
# vite.config.ts (dev) and render.yaml (deploy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin "*" always;

    # nginx's bundled mime.types has no entry for .mjs, so it would go out as
    # application/octet-stream — and a browser refuses to execute a module script served with a
    # non-JavaScript MIME type. Pyodide's runtime ships as .mjs, so without this the sandbox fails
    # to start in the Docker/production build only, with "Failed to fetch dynamically imported
    # module". The empty `types` map means nothing matches and default_type applies.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }

    # Client-side routing: /objects/<id> and /implementations/<id> are real URLs to the app but not
    # files on disk. sandbox.html is a real file and so is matched by $uri before the fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
