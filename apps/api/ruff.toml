line-length = 100
target-version = "py313"

[lint]
# E/F (pycodestyle, pyflakes), I (import order), UP (modern syntax), B (bugbear),
# SIM/RET/PIE/C4 (simplification, returns, misc, comprehensions),
# ERA (commented-out code), RUF (ruff's own).
#
# This codebase's specific hazards: ASYNC (blocking calls inside async), S (security),
# DTZ (timezone-naive datetimes), LOG/G (logging call shape), PTH (pathlib over os.path),
# PT (pytest style), PLC0415 (imports at module level), TID (the banned-API list below).
#
# D* is Google style's docstring shape: a one-line imperative summary ending in a period
# ("Return the pathname."), a blank line, then any elaboration. D205 (no summary line) and D401
# (summary isn't imperative) carry it; the rest are cosmetic. D1* (missing-docstring) stays off —
# a docstring is omitted when the name and signature already say it.
select = ["E", "F", "I", "UP", "B", "SIM", "PLC0415", "ASYNC", "S", "RUF", "LOG", "G", "DTZ", "PT", "C4", "PIE", "RET", "ERA", "PTH", "TID", "ANN401", "D200", "D201", "D202", "D205", "D209", "D210", "D401", "D403", "D415", "D419"]

[lint.isort]
known-first-party = ["monet_api"]

# A test that waits on a guessed wall-clock duration flakes under contention — wait on the
# condition instead of a bare sleep. src/** is exempt below: production code may legitimately
# sleep (rate limiting, poll intervals).
[lint.flake8-tidy-imports.banned-api]
"asyncio.sleep".msg = "Wait on the condition instead of a wall-clock sleep. If this really is a deliberate wait: # noqa: TID251  # wall-clock: <reason>"
"time.sleep".msg = "Wait on the condition instead of a wall-clock sleep. If this really is a deliberate wait: # noqa: TID251  # wall-clock: <reason>"

[lint.per-file-ignores]
# Alembic's own revision template writes the module docstring, and every autogenerated file
# inherits it — the D rules would fight the generator, not the author. E501: a generated
# `op.execute(...)` line can render as one long string once Python's repr() escapes embedded
# quotes, which ruff/black formatting never wraps.
"alembic/versions/*.py" = ["D", "E501"]
# assert is the standard pytest idiom, not a stripped-under-`-O` runtime invariant.
"tests/**/*.py" = ["S101"]
# TID's banned-api (above) is selected repo-wide via "TID" in `select`; this negated glob confines
# it to tests/ alone.
"!tests/**" = ["TID251"]
"scripts/implementations/*.py" = ["F821", "D"]

