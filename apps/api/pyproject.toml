[project]
name = "monet-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlmodel>=0.0.48",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.2",
    "greenlet>=3.5.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monet_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All tests/fixtures share one event loop, matching the module-level async engine's
# connection pool lifecycle — asyncpg connections are bound to the loop that opened
# them, so a per-test loop would break the pool on the second test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
