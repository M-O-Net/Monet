[project]
name = "monet-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.52.3",
    "sqlmodel>=0.0.24",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic-settings>=2.8",
    "greenlet>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monet_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# All tests/fixtures share one event loop, matching the module-level async engine's
# connection pool lifecycle — asyncpg connections are bound to the loop that opened
# them, so a per-test loop would break the pool on the second test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
