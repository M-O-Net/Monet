services:
  postgres:
    image: postgres:17-alpine
    environment:
      # No `:-default` here: a weak default a real deploy might silently inherit isn't
      # a default worth having. `.env.example` documents this; `.env` must set it for
      # real (see Muse's infra/docker-compose.yml for the same pattern).
      POSTGRES_USER: monet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — see .env.example}
      POSTGRES_DB: monet
    # Deliberately publishes NO host port. The only thing that ever wanted one was host-side
    # pytest reaching the dev DB; tests now run inside the stack against `monet_test` (see
    # docker-compose.dev.yml's `test` service), so nothing outside the compose network needs
    # Postgres. It also removes a real collision: `just wt-add` allocates API_PORT/WEB_PORT per
    # worktree but never allocated a PG port, so every worktree's stack fought for the same one
    # and the second to start failed to bind. Muse's infra/docker-compose.yml publishes none
    # either. Need a psql shell? Go in through the container:
    # `docker compose --env-file .env --env-file .env.local exec postgres psql -U monet monet`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monet"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Named explicitly even though `final` is the Dockerfile's last stage anyway — the file
      # also carries `test-deps`/`test` stages now, and an unqualified build would follow
      # whatever ends up last.
      target: final
    environment:
      DATABASE_URL: postgresql+asyncpg://monet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — see .env.example}@postgres:5432/monet
    ports:
      - "${API_PORT:-8300}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: serve
    ports:
      - "${WEB_PORT:-5273}:80"
    depends_on:
      - api

volumes:
  postgres_data:
