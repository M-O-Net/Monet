name: CI

# Runs on PRs against main only — verification belongs before a merge, not after it, and
# `pull_request` runs against the merge commit GitHub would actually land. There's no
# `push: [main]` trigger for the same reason Muse's doesn't have one: a PR run already tested
# the tree the squash merge lands.
#
# `changes` (and everything under it) is gated on `github.event.pull_request.draft == false` —
# every PR is born a draft (`just pr`), so pushes to one cost nothing here; the local equivalent
# (`.githooks/pre-commit`) runs instead. The full suite runs once, at `just land`, which flips
# the PR out of draft only after it passes locally — and that flip is what fires this workflow
# for real.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "Changes: detect"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' }}
      code: ${{ steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # The compose files and this workflow are part of how the API is tested now (the
            # suite runs as the `test` compose service, not host-side pytest), so a change to
            # either has to be able to trigger this job on its own.
            api:
              - 'apps/api/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            code:
              - '!**/*.md'

  api:
    name: "API: lint/test/build"
    needs: changes
    if: needs.changes.outputs.api == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --dev --locked

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: apps/api/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Lint
        run: just lint-api

      # No `Migrate` step any more, and no GitHub `services: postgres` above: the suite runs as
      # the `test` compose service, which brings up its own Postgres and whose entrypoint
      # recreates + migrates + `alembic check`s the monet_test DB itself. See the run step below.

      # Compose interpolates POSTGRES_PASSWORD out of `.env`, which is gitignored. Starting from
      # the checked-in template rather than writing the keys out again here: a variable the
      # compose files newly require reaches CI by being added to `.env.example` (which whoever
      # adds it has to touch anyway), instead of via a second hand-maintained list that drifts
      # silently and surfaces as an interpolation error on some unrelated PR.
      - name: Write CI .env
        run: cp .env.example .env

      # Builds the `deps` stage on its own and caches it as a tarball — actions/cache doesn't
      # store Docker layers directly, and `type=gha` silently fails to cache this layer's
      # `--mount=type=cache` uv contents (a known BuildKit/GHA-cache-backend gap), which is why
      # this uses the manual save/restore technique instead of the frontend job's `type=gha`.
      - name: Compute deps cache key
        id: deps-key
        run: echo "key=monet-api-deps-${{ hashFiles('apps/api/pyproject.toml', 'apps/api/uv.lock', 'apps/api/Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached deps image
        id: cache-deps-image
        uses: actions/cache/restore@v6
        with:
          path: /tmp/monet-api-deps.tar
          key: ${{ steps.deps-key.outputs.key }}

      - name: Load cached deps image
        if: steps.cache-deps-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/monet-api-deps.tar

      - name: Build deps image
        if: steps.cache-deps-image.outputs.cache-hit != 'true'
        run: |
          docker build --target deps -f apps/api/Dockerfile -t monet-api-deps:cache .
          docker save monet-api-deps:cache -o /tmp/monet-api-deps.tar

      - name: Save deps image to cache
        if: steps.cache-deps-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/monet-api-deps.tar
          key: ${{ steps.deps-key.outputs.key }}

      # `test-deps` (the dev dependency group on top of `deps`) gets the same tarball treatment,
      # and for the same reason: it too installs through `--mount=type=cache`, which `type=gha`
      # would not export. Layering it on the already-loaded `monet-api-deps:cache` rather than
      # rebuilding `deps` from scratch is what the --build-arg below is for.
      - name: Compute test-deps cache key
        id: test-deps-key
        run: echo "key=monet-api-test-deps-${{ hashFiles('apps/api/pyproject.toml', 'apps/api/uv.lock', 'apps/api/Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore cached test-deps image
        id: cache-test-deps-image
        uses: actions/cache/restore@v4
        with:
          path: /tmp/monet-api-test-deps.tar
          key: ${{ steps.test-deps-key.outputs.key }}

      - name: Load cached test-deps image
        if: steps.cache-test-deps-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/monet-api-test-deps.tar

      - name: Build test-deps image
        if: steps.cache-test-deps-image.outputs.cache-hit != 'true'
        run: |
          docker build --target test-deps --build-arg DEPS_IMAGE=monet-api-deps:cache -f apps/api/Dockerfile -t monet-api-test-deps:cache .
          docker save monet-api-test-deps:cache -o /tmp/monet-api-test-deps.tar

      - name: Save test-deps image to cache
        if: steps.cache-test-deps-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/monet-api-test-deps.tar
          key: ${{ steps.test-deps-key.outputs.key }}

      # Built as an explicit step, separate from running it, purely so the two --build-arg values
      # can be threaded in: `just test-api`'s own `--build` passes neither, so it would rebuild
      # `deps`/`test-deps` from their in-file fallback stages and throw away the two
      # cache-restored images the steps above just loaded — the entire point of caching them.
      - name: Build test image
        run: >
          docker compose --env-file .env
          -f docker-compose.yml -f docker-compose.dev.yml
          build --build-arg DEPS_IMAGE=monet-api-deps:cache --build-arg TEST_DEPS_IMAGE=monet-api-test-deps:cache
          test

      # The image is already built by the step above, so this only runs it (no `--build`, unlike
      # `just test-api`). Starts postgres via the service's own `depends_on`, drops/recreates and
      # migrates monet_test, runs `alembic check`, then pytest.
      - name: Test
        run: >
          docker compose --env-file .env
          -f docker-compose.yml -f docker-compose.dev.yml
          run --rm test

      - name: Build full image (proves the Dockerfile actually builds)
        run: docker build --target final --build-arg DEPS_IMAGE=monet-api-deps:cache -f apps/api/Dockerfile -t monet-api:ci .

  web:
    name: "Web: lint/build"
    needs: changes
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: just lint-web

      - name: Build
        run: just build-web

      # `vite build` regenerates this file in place. It is committed (eslint and tsc read it
      # before any build has run), so a diff here means the pinned router-plugin no longer emits
      # what is checked in — typically after a plugin bump whose PR did not regenerate it.
      - name: Route tree is up to date
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: monet-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
